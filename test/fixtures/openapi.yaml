openapi: "3.0.3"
info:
  title: demo
  version: "1.0.0"
paths:
  /webhooks:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Webhook"
components:
  schemas:
    Webhook:
      type: object
      properties:
        callbackUrl:
          type: string
          format: uri
      required:
        - callbackUrl
